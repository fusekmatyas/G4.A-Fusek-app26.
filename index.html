<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Objednávka jídla</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<h1>FoodExpress</h1>

<table id="menu">
    <thead>
        <tr>
            <th>Produkt</th>
            <th>Cena (Kč)</th>
            <th>Množství</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div class="summary">
    <p>Počet kusů: <span id="ks">0</span></p>
    <p>Celková cena: <span id="cena">0</span> Kč</p>
</div>

<div class="form">
    <input type="text" placeholder="Jméno" id="jmeno">
    <input type="text" placeholder="Příjmení" id="prijmeni"><br>
    <input type="email" placeholder="Email" id="email">
    <input type="tel" placeholder="Telefon" id="telefon"><br>
    <button onclick="odeslat()">ODESLAT OBJEDNÁVKU</button>
</div>

<script>
let produkty = [];

// ✅ Automatické načtení CSV
fetch("produkty.csv")
    .then(res => res.text())
    .then(data => {
        const radky = data.trim().split("\n").slice(1);
        const tbody = document.querySelector("#menu tbody");

        radky.forEach((radek, index) => {
            const [nazev, cena] = radek.split(",");
            produkty.push({ nazev, cena: parseInt(cena) });

            tbody.innerHTML += `
                <tr>
                    <td>${nazev}</td>
                    <td>${cena}</td>
                    <td>
                        <input type="number" min="0" value="0"
                        onchange="prepocet()" id="p${index}">
                    </td>
                </tr>
            `;
        });
    });

// ✅ Přepočet ceny a kusů
function prepocet() {
    let ks = 0;
    let cena = 0;

    produkty.forEach((p, i) => {
        let q = parseInt(document.getElementById("p"+i).value) || 0;
        ks += q;
        cena += q * p.cena;
    });

    document.getElementById("ks").innerText = ks;
    document.getElementById("cena").innerText = cena;
}

// ✅ Odeslání přes MAILTO
function odeslat() {
    const jmeno = document.getElementById("jmeno").value;
    const prijmeni = document.getElementById("prijmeni").value;
    const email = document.getElementById("email").value;
    const telefon = document.getElementById("telefon").value;

    if (!jmeno || !prijmeni || !email || !telefon) {
        alert("Vyplň všechny údaje!");
        return;
    }

    let text = "Objednávka:\n\n";
    let ksCelkem = 0;
    let cenaCelkem = 0;

    produkty.forEach((p, i) => {
        let q = parseInt(document.getElementById("p"+i).value) || 0;
        if (q > 0) {
            let mezicena = q * p.cena;
            text += `${p.nazev} - ${q} ks - ${mezicena} Kč\n`;
            ksCelkem += q;
            cenaCelkem += mezicena;
        }
    });

    text += `\nCelkem kusů: ${ksCelkem}`;
    text += `\nCelková cena: ${cenaCelkem} Kč\n`;

    text += `\nZákazník:\n${jmeno} ${prijmeni}\n${email}\n${telefon}`;

    // ✅ MAILTO (otevře e-mail klienta)
    const mailtoLink = `mailto:app@kostka-skola.cz?subject=Objednávka jídla&body=${encodeURIComponent(text)}`;

    window.location.href = mailtoLink;
}
</script>

</body>
</html>
``
